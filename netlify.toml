# Netlify configuration — Shiv Engineering
# Static site: nothing to build, the repo root is published as-is.

[build]
  publish = "."
  command = ""

# --- Security headers -------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# --- Caching ----------------------------------------------------------
# HTML always revalidates so content edits go live immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS/JS are not fingerprinted, and main.js injects the contact details at
# runtime — a stale copy would overwrite correct HTML with old values.
# Both files are small and served with an ETag, so revalidation costs a 304.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
